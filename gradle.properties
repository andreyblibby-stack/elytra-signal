# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# NOTE: these are known-good values as of when this file was written, but
# Fabric releases new builds constantly. Before running `gradlew build`,
# open https://fabricmc.net/develop/ , pick Minecraft 1.21.1 (or whichever
# 1.21.x you're actually on), and copy the current values it gives you for
# yarn_mappings / loader_version / fabric_version into this file - that
# guarantees you're not building against a stale/removed version.

# Fabric Properties
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.9

# Mod Properties
mod_version=1.0.0
maven_group=com.example
archives_base_name=elytrasignal

# Dependencies
fabric_version=0.107.0+1.21.1
